<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#12151a"/>
    </linearGradient>

    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#87cf3e"/>
      <stop offset="100%" stop-color="#58a727"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#87cf3e" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Dark Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#2d333f" stroke-width="4"/>

  <!-- Tabbed Note Pad Layer -->
  <g filter="url(#cardShadow)">
    <rect x="124" y="100" width="264" height="312" rx="28" fill="#252a36" stroke="#363d4e" stroke-width="3"/>
    <path d="M 148 100 L 230 100 A 8 8 0 0 1 238 108 L 244 126 A 10 10 0 0 0 254 134 L 364 134 A 24 24 0 0 1 388 158 L 388 170 L 124 170 L 124 124 A 24 24 0 0 1 148 100 Z" fill="#2d3342"/>
    <line x1="168" y1="205" x2="344" y2="205" stroke="#3d4659" stroke-width="5" stroke-linecap="round"/>
    <line x1="168" y1="245" x2="310" y2="245" stroke="#3d4659" stroke-width="5" stroke-linecap="round"/>
    <line x1="168" y1="285" x2="280" y2="285" stroke="#3d4659" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Glowing Checkmark Ring -->
  <g filter="url(#glow)">
    <circle cx="256" cy="310" r="88" fill="#181c24" stroke="url(#mintGrad)" stroke-width="14"/>
    <circle cx="256" cy="310" r="74" fill="#1e242f"/>
    <path d="M 218 308 L 246 336 L 298 280" fill="none" stroke="url(#mintGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="186" cy="117" r="6" fill="#87cf3e"/>
</svg>
